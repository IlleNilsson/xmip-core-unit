[package]
name = "xmip-core-unit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository = "https://github.com/IlleNilsson/xmip-core-unit"
description = "The standard units: Xmip's own module of compiled units at receive, process and send, its manifest written from their declarations."

[dependencies]
# The declaration of a unit and the stages it runs at, and the settings
# shape every declaration is written in.
node = { workspace = true }
xcore = { workspace = true }
# The capabilities whose units these are, each unit implemented there once.
prepare = { workspace = true }
transform = { workspace = true }
contract = { workspace = true }
path = { workspace = true }
promote = { workspace = true }
demote = { workspace = true }
process = { workspace = true }
# The OpenPGP engines Encryption and Signature choose among.
rpgp = { workspace = true }
# The contract technologies Validate holds a Stream to, by its format.
asyncapi = { workspace = true }
avro = { workspace = true }
csv = { workspace = true }
edifact = { workspace = true }
x12 = { workspace = true }
fhir = { workspace = true }
fixed_width = { workspace = true }
graphql_schema = { workspace = true }
hl7_v2 = { workspace = true }
json_schema = { workspace = true }
openapi = { workspace = true }
protobuf = { workspace = true }
regex = { workspace = true }
schematron = { workspace = true }
contract_sql = { workspace = true }
toml = { workspace = true }
toon = { workspace = true }
wsdl = { workspace = true }
xml_schema = { workspace = true }
yaml = { workspace = true }
# The path languages Promote and Demote read and write through.
xpath = { workspace = true }
jsonpath = { workspace = true }
dot = { workspace = true }
json_pointer = { workspace = true }
index = { workspace = true }
edi = { workspace = true }
hl7_v2_path = { workspace = true }
regex_path = { workspace = true }
fhirpath = { workspace = true }

# The module's timing program (doc/governance/rust-style.md section 5c): a
# plain cargo test leaves it out, and the landing runs it after every other
# test here, alone, one test at a time, so what it measures is Xmip's work.
[[test]]
name = "measured"
path = "tests/measured/main.rs"
test = false

[dev-dependencies]
# The counting allocator and the one latency spread the estate's tests
# measure with.
xcore = { workspace = true, features = ["test-support"] }
# A test's own temporary folder (`file::temporary`); for the tests only.
file = { workspace = true, features = ["test-support"] }
stream = { workspace = true }
context = { workspace = true }

[lints]
workspace = true
